
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLB Lockout Simulator</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101820;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }

    main {
      max-width: 650px;
      padding: 40px 24px;
      border: 1px solid #43515d;
      border-radius: 16px;
      background: #1c2833;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      margin-bottom: 12px;
    }

    p {
      color: #d0d8df;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 24px;
      border-radius: 8px;
      background: #e63946;
      color: white;
      font-weight: bold;
      text-decoration: none;
    }

    a:hover {
      background: #c62835;
    }

    small {
      display: block;
      margin-top: 28px;
      color: #aab6c2;
    }
  </style>
</head>
<body>
  <main>
    <h1>⚾ Save the Season</h1>
    <p>
      Take charge of baseball's future.
      Make the tough decisions, negotiate a deal,
      and see if you can save the 2027 season.
    </p>

    <a href="https://lockout2027.com/"
       target="_blank"
       rel="noopener noreferrer">
      OPEN THE SIMULATOR
    </a>

    <small>
      An independent fan page. Not affiliated with MLB.
    </small>
  </main>
</body>
</html>
